# overlay/staking.yaml — Editable staking curve (D8)
#
# bankroll_share_per_stake_unit: fraction of bankroll per stake unit
# no_bet_below_edge: minimum edge to place any bet
# edge_thresholds: edge range → stake unit mapping
#
# D6: kelly_scale applied BEFORE stake quantize in calculator.py
# (kelly_scale from overlay rules × bank_share_raw → final euros)

bankroll_share_per_stake_unit: 0.06
no_bet_below_edge: 0.05

edge_thresholds:
  - {edge_min: 0.05, edge_max: 0.07, stake: 2}
  - {edge_min: 0.07, edge_max: 0.10, stake: 4}
  - {edge_min: 0.10, edge_max: 0.13, stake: 6}
  - {edge_min: 0.13, edge_max: 0.16, stake: 8}
  - {edge_min: 0.16, edge_max: 1.00, stake: 10}

# ============================================================
# pyproject.toml — foultsPredictor configuration
# La Liga foul prediction system (client: HOWY)
# ============================================================

[project]
name = "foults-predictor"
version = "0.1.0"
description = "La Liga match foul prediction system using ensemble ML"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "undetected-chromedriver>=3.5.0",
    "torch>=2.0",
    "statsmodels>=0.14",
    "pgmpy>=0.0.21",
    "seaborn>=0.13",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# -- Ruff (linting + formatting) -----------------------------------------

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modernize syntax)
    "B",      # flake8-bugbear (likely bugs)
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line length -- handled by formatter
    "N806",   # variable in function should be lowercase (allow DataFrame vars like X)
    "N803",   # argument name should be lowercase (allow ML convention params)
    "N802",   # function name should be lowercase (allow legacy names during migration)
    "N815",   # mixedCase variable in class scope (allow during migration)
    "N816",   # mixedCase variable in global scope (allow during migration)
]

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "selection",
    "transformation",
    "assembly",
    "evaluation",
    "src",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -- Pyright (type checking) ---------------------------------------------

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

# -- Pytest ---------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "features_generator", "prediction_models"]
addopts = "-v --tb=short"

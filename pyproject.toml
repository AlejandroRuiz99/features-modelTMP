# ============================================================
# pyproject.toml — foultsPredictor configuration
# La Liga foul prediction system (client: HOWY)
# ============================================================

[project]
name = "foults-predictor"
version = "0.1.0"
description = "La Liga match foul prediction system using ensemble ML"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.32.0",
    "supabase>=2.10.0",
    "python-dotenv>=1.1.0",
    "beautifulsoup4>=4.12.3",
    "undetected-chromedriver>=3.5.5",
    "torch>=2.6",
    "statsmodels>=0.14.4",
    "pgmpy>=0.1.26,<1.0.0",  # 1.0.0 tiene breaking changes — migrar antes de subir
    "seaborn>=0.13.2",
    "numpy>=2.0",
    "pandas>=2.2,<3.0",  # 3.0 tiene breaking changes (CoW obligatorio) — migrar antes de subir
    "pyarrow>=18.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyyaml>=6.0.2",
    "matplotlib>=3.9",
    "tqdm>=4.67",
    "python-telegram-bot>=21.0",
    "APScheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pytest>=9.0",
    "pytest-cov>=6.0",
]

# -- Ruff (linting + formatting) -----------------------------------------

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modernize syntax)
    "B",      # flake8-bugbear (likely bugs)
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line length -- handled by formatter
    "N806",   # variable in function should be lowercase (allow DataFrame vars like X)
    "N803",   # argument name should be lowercase (allow ML convention params)
    "N802",   # function name should be lowercase (allow legacy names during migration)
    "N815",   # mixedCase variable in class scope (allow during migration)
    "N816",   # mixedCase variable in global scope (allow during migration)
]

[tool.ruff.lint.per-file-ignores]
# Test helpers that manipulate sys.path before overlay imports (E402 is intentional)
"tests/**/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "selection",
    "transformation",
    "assembly",
    "evaluation",
    "src",
    "HWFP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -- Pyright (type checking) ---------------------------------------------

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

# -- Pytest ---------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests", "HWFP/tests"]
pythonpath = [".", "features_generator", "prediction_models", "HWFP"]
addopts = "-v --tb=short"
python_files = ["test_*.py", "contract_*.py"]
